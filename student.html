<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal - NTS Travel Services</title>
    <meta name="description" content="Bus tracking, student polling, and boarding confirmation for NUST students." />
    <meta property="og:title" content="NTS Travel Services - Student Portal" />
    <meta property="og:description" content="Bus tracking, student polling, and boarding confirmation for NUST students." />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="./ui-preferences.js"></script>
    <link rel="stylesheet" href="./student.css" />
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-container">
        <a href="index.html" class="app-logo">
          <span class="logo-icon"><i data-lucide="bus-front"></i></span>
          <div class="logo-text">
            <span>NTS STUDENT PORTAL</span>
            <span>NUST University Transport</span>
          </div>
        </a>

        <div style="display: flex; gap: 14px; align-items: center;">
          <!-- User Chip -->
          <div style="text-align: right; display: flex; flex-direction: column;">
            <strong id="user-display-name" style="font-size: 0.95rem; color: var(--text-main);">Hamza Malik</strong>
            <span id="user-display-id" style="font-size: 0.78rem; color: var(--text-muted);">NUST-2022-CS-101</span>
          </div>

          <!-- Notification Bell -->
          <button id="student-notif-btn" class="btn-notif" title="Notifications" style="position: relative; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-full); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.15rem;">
            🔔
            <span id="notif-unread-badge" class="notif-badge" style="position: absolute; top: -4px; right: -4px; background: var(--status-danger); color: #fff; font-size: 0.7rem; font-weight: 800; border-radius: var(--radius-full); width: 18px; height: 18px; display: none; align-items: center; justify-content: center;">
              0
            </span>
          </button>

          <!-- Logout -->
          <button id="btn-student-logout" class="btn btn-outline btn-sm">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Student Navigation Tabs Bar -->
    <div style="background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 40;">
      <div class="content-container">
        <div class="student-tabs">
          <button class="student-tab-btn active" data-tab="morning-poll">
            🌅 Going to University (Morning)
          </button>
          <button class="student-tab-btn" data-tab="return-poll">
            🌇 Returning from University (Return)
          </button>
          <button class="student-tab-btn" data-tab="track-bus">
            <i data-lucide="map-pin"></i> <span data-i18n="Track My Bus">Track My Bus</span>
          </button>
          <button class="student-tab-btn" data-tab="journey-history">
            <i data-lucide="clipboard-list"></i> <span data-i18n="My Journey History">My Journey History</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-container">
        <!-- Live Arrival Boarding Confirmation Alert (Prompts when bus reaches stop) -->
        <div id="active-boarding-banner-container"></div>

        <!-- Dynamic Tab Body -->
        <div id="student-content-area"></div>
      </div>
    </main>

    <!-- Slide-out Notification Drawer -->
    <div id="notif-drawer" class="notif-drawer" style="position: fixed; top: 0; right: -380px; width: 360px; height: 100vh; background: #ffffff; box-shadow: -5px 0 25px rgba(0,0,0,0.15); z-index: 100; transition: right 0.3s ease; display: flex; flex-direction: column;">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-subtle);">
        <h3 style="margin: 0; font-size: 1.1rem;">🔔 Notifications</h3>
        <button id="close-notif-drawer" style="background: none; border: none; font-size: 1.4rem; cursor: pointer;">&times;</button>
      </div>
      <div id="notif-items-list" style="flex: 1; overflow-y: auto;">
        <!-- In-app notifications list -->
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module">
      import { StudentPortalController } from './student.js';
      document.addEventListener('DOMContentLoaded', () => {
        new StudentPortalController().init();
      });
    </script>
  </body>
</html>
